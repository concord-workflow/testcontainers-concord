name: build

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        jdk_version: [ '17' ]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '${{ matrix.jdk_version }}'
          distribution: 'temurin'

      - name: Checkout
        uses: actions/checkout@v3

      - name: Build and test with Maven
        env:
          TESTCONTAINERS_CONCORD_SERVER_IMAGE: walmartlabs/concord-server:2.25.1
          TESTCONTAINERS_CONCORD_AGENT_IMAGE: walmartlabs/concord-agent:2.25.1
        run: ./mvnw -B clean install
